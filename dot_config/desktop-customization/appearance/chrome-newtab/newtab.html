<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Новая вкладка</title>
  <link rel="stylesheet" href="palette.css">
  <link rel="stylesheet" href="newtab.css">
  <script src="newtab.js" defer></script>
</head>
<body>
  <div class="layout">
    <main class="panel">
      <header class="masthead"><span class="mark" aria-hidden="true">◈</span><span>COLD GREY</span></header>
      <div class="tools">
        <h1>Что найдём?</h1>
        <form id="search" action="https://www.google.com/search" method="get" role="search">
          <label class="sr-only" for="query">Поиск в Google</label>
          <input id="query" name="q" type="search" placeholder="Поиск в Google" autocomplete="off" required maxlength="2048">
          <button class="search-button" type="submit" aria-label="Найти">↗</button>
        </form>
        <section aria-label="Быстрый доступ">
          <div class="section-heading"><h2>Быстрый доступ</h2><button id="manage" class="text-button" type="button">Настроить</button></div>
          <div id="shortcuts" class="shortcuts" aria-busy="true"></div>
        </section>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
      <footer><span>MAOMAO</span><span>Artwork · Nyte_Tyde</span></footer>
    </main>
    <div class="artwork" aria-hidden="true"><img id="art" src="images/maomao-cold-grey-dark.png" alt="" width="2480" height="1929"></div>
  </div>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="dialog-heading"><h2 id="settings-title">Быстрый доступ</h2><button type="button" class="close" id="close-settings" aria-label="Закрыть настройки">×</button></div>
    <p class="hint">Твои ярлыки хранятся в этом браузере. Экспорт сохрани перед переносом на новый компьютер.</p>
    <div id="shortcut-list" class="shortcut-list"></div>
    <div class="settings-actions"><button id="add" type="button">Добавить ярлык</button><button id="export" type="button" class="secondary">Экспорт</button><button id="import" type="button" class="secondary">Импорт</button></div>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <p id="settings-status" class="status" role="status" aria-live="polite"></p>
  </dialog>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="shortcut-form">
      <div class="dialog-heading"><h2 id="editor-title">Добавить ярлык</h2><button type="button" class="close" id="close-editor" aria-label="Закрыть редактор">×</button></div>
      <label for="shortcut-name">Название</label><input id="shortcut-name" maxlength="40" required autocomplete="off">
      <label for="shortcut-url">Адрес</label><input id="shortcut-url" type="url" maxlength="2048" placeholder="https://example.com" required autocomplete="off">
      <p id="editor-status" class="status" role="status"></p>
      <div class="settings-actions"><button id="save" type="submit">Сохранить</button><button id="cancel-editor" type="button" class="secondary">Отмена</button></div>
    </form>
  </dialog>
  <dialog id="import-confirm" aria-labelledby="import-title">
    <h2 id="import-title">Импорт ярлыков</h2><p id="import-summary"></p>
    <div class="settings-actions"><button id="confirm-import" type="button">Заменить ярлыки</button><button id="cancel-import" type="button" class="secondary">Отмена</button></div>
  </dialog>
</body>
</html>
