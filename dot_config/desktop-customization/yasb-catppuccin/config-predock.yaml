watch_stylesheet: true
watch_config: true
debug: false
komorebi:
  start_command: komorebic start --whkd
  stop_command: komorebic stop --whkd
  reload_command: komorebic reload-configuration
bars:
  status-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: true
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 36
    padding:
      top: 8
      left: 8
      bottom: 14
      right: 8
    widgets:
      left:
      - win_button
      - active_window
      center:
      - clock
      - komorebi_workspaces
      - komorebi_active_layout
      right:
      - vpn_domain_submit
      - zmk_layer
      - vial_layer
      - daemon_reset
      - media
      - language
      - open_meteo
      - volume
      - apps
      - power_menu
widgets:
  vpn_domain_submit:
    type: yasb.custom.CustomWidget
    options:
      label: VPN +
      class_name: vpn-domain-submit-widget
      tooltip: true
      tooltip_label: 'Left: add/check domain | Right: check clipboard domain'
      callbacks:
        on_left: exec wscript.exe "%USERPROFILE%\.config\yasb\scripts\vpn_domain_submit_launcher.vbs"
        on_middle: exec wscript.exe "%USERPROFILE%\.config\yasb\scripts\vpn_domain_submit_launcher.vbs"
        on_right: exec wscript.exe "%USERPROFILE%\.config\yasb\scripts\vpn_domain_check_launcher.vbs"
  zmk_layer:
    type: yasb.custom.CustomWidget
    options:
      label: ZMK {data[label]}
      label_alt: ZMK {data[label]}
      class_name: zmk-layer-widget
      tooltip: true
      tooltip_label: '{data[tooltip]}'
      exec_options:
        run_cmd: __BRIDGE_CMD__\DesktopBridge.exe --read zmk
        run_interval: 1000
        return_format: json
        use_shell: false
        encoding: utf-8
      callbacks:
        on_right: toggle_label
  vial_layer:
    type: yasb.custom.CustomWidget
    options:
      label: VIAL {data[label]}
      label_alt: VIAL {data[label]}
      class_name: vial-layer-widget
      tooltip: false
      exec_options:
        run_cmd: __BRIDGE_CMD__\DesktopBridge.exe --read vial
        run_interval: 1000
        return_format: json
        use_shell: false
        encoding: utf-8
      callbacks:
        on_left: exec cmd /c wscript.exe "%USERPROFILE%\.config\yasb\scripts\vial_layout_overlay_launcher.vbs"
        on_right: toggle_label
  daemon_reset:
    type: yasb.custom.CustomWidget
    options:
      label: 
      class_name: win-button-widget
      tooltip: true
      tooltip_label: 'ЛКМ: перезапустить помощники · ПКМ: меню запуска/остановки, AHK и Vial'
      callbacks:
        on_left: exec "__BRIDGE__\DesktopBridge.exe" --service RestartAll
        on_right: exec "__BRIDGE__\DesktopBridge.exe" --menu services
  language:
    type: yasb.language.LanguageWidget
    options:
      label: '{lang[language_code]}'
      label_alt: '{lang[full_layout_name]}'
      update_interval: 5
      callbacks:
        on_left: toggle_menu
        on_right: toggle_label
      language_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: right
        direction: down
        offset_top: 8
        offset_left: 0
        show_layout_icon: true
        layout_icon: 
  media:
    type: yasb.media.MediaWidget
    options:
      label: '{title} - {artist}'
      label_alt: '{title}'
      max_field_size:
        label: 20
        label_alt: 30
      show_thumbnail: true
      controls_only: false
      controls_left: true
      hide_empty: true
      thumbnail_alpha: 100
      thumbnail_padding: 8
      thumbnail_corner_radius: 0
      icons:
        prev_track: 
        next_track: 
        play: 
        pause: 
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '[class_name=''{win[class_name]}'' exe=''{win[process][name]}'' hwnd={win[hwnd]}]'
      label_no_window: ''
      label_icon: true
      label_icon_size: 14
      max_length: 56
      max_length_ellipsis: '...'
      monitor_exclusive: true
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a %d, %b %H:%M}'
      label_alt: '{%A %d %B %Y, %H:%M}'
      timezones: []
  komorebi_workspaces:
    type: komorebi.workspaces.WorkspaceWidget
    options:
      label_offline: Komorebi Offline
      label_workspace_btn: "\uDB81\uDC3D"
      label_workspace_active_btn: "\uDB81\uDC3E"
      label_default_name: '{index}'
      label_zero_index: false
      hide_empty_workspaces: false
      hide_if_offline: false
  komorebi_active_layout:
    type: komorebi.active_layout.ActiveLayoutWidget
    options:
      hide_if_offline: true
      label: '{icon}'
      layouts:
      - bsp
      - columns
      - rows
      - grid
      - scrolling
      - vertical_stack
      - horizontal_stack
      - ultrawide_vertical_stack
      - right_main_vertical_stack
      layout_icons:
        bsp: BSP
        scrolling: SCRL
        columns: COLS
        rows: ROWS
        grid: GRID
        vertical_stack: V-STACK
        horizontal_stack: H-STACK
        ultrawide_vertical_stack: W-STACK
        right_main_vertical_stack: RMV-STACK
        monocle: MONOCLE
        maximized: MAX
        floating: FLOATING
        paused: PAUSED
      callbacks:
        on_left: next_layout
        on_middle: toggle_monocle
        on_right: prev_layout
  open_meteo:
    type: yasb.open_meteo.OpenMeteoWidget
    options:
      label: <span>{icon}</span> {temp}
      label_alt: '{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}'
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: metric
      callbacks:
        on_left: toggle_card
        on_middle: do_nothing
        on_right: toggle_label
      icons:
        sunnyDay: 
        clearNight: 
        cloudyDay: 
        cloudyNight: 
        drizzleDay: "\uDB81\uDE7E"
        drizzleNight: "\uDB81\uDE7E"
        rainyDay: 
        rainyNight: 
        snowyDay: 
        snowyNight: 
        foggyDay: 
        foggyNight: 
        thunderstormDay: 
        thunderstormNight: 
        default: 
      weather_card:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        icon_size: 48
        show_hourly_forecast: true
        time_format: 24h
        hourly_point_spacing: 76
        hourly_icon_size: 24
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: '#8EAEE8'
        current_line_width: 1
        current_line_style: dot
        hourly_gradient:
          enabled: false
          top_color: '#8EAEE8'
          bottom_color: '#2A3E68'
        hourly_forecast_buttons:
          enabled: false
          default_view: temperature
          temperature_icon: "\uDB81\uDD99"
          rain_icon: "\uDB81\uDD96"
          snow_icon: "\uDB81\uDD98"
        weather_animation:
          enabled: false
          snow_overrides_rain: true
          temp_line_animation_style: both
          rain_effect_intensity: 1.0
          snow_effect_intensity: 1.0
          scale_with_chance: true
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span>{icon}</span> {level}
      label_alt: '{level}'
      icons:
      - 
      - 
      - 
      - 
      - 
      callbacks:
        on_right: exec cmd.exe /c start ms-settings:sound
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: 
      uptime: true
      blur: false
      blur_background: true
      animation_duration: 300
      button_row: 3
      buttons:
        lock:
        - 
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        shutdown:
        - 
        - Shut Down
        restart:
        - 
        - Restart
        hibernate:
        - 
        - Hibernate
        cancel:
        - "\uDB81\uDF3A"
        - Cancel
  apps:
    type: yasb.applications.ApplicationsWidget
    options:
      label: '{data}'
      app_list:
      - icon: 
        launch: notification_center
      - icon: 
        launch: quick_settings
      - icon: 
        launch: cmd.exe /c start ms-settings:windowsupdate
      - icon: 
        launch: search
      - icon: "\uDB84\uDF55"
        launch: widget
  taskbar:
    type: yasb.taskbar.TaskbarWidget
    options:
      icon_size: 14
  win_button:
    type: yasb.custom.CustomWidget
    options:
      label: 
      label_alt: 
      class_name: win-button-widget
      callbacks:
        on_left: exec start_menu
