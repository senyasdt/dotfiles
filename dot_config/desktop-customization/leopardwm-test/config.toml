# Native file/property/dialog windows keep their own geometry before app rules.
[[window_rules]]
match_class = "^#32770$"
action = "float"

# Explorer folders only: never match desktop, taskbar or shell flyouts.
[[window_rules]]
match_executable = "explorer.exe"
match_class = "^(CabinetWClass|ExploreWClass)$"
action = "tile"
column_width = 0.5

# Large MMC consoles; remaining MMC main windows use 62%.
[[window_rules]]
match_executable = "mmc.exe"
match_class = "^MMCMainFrame$"
match_title = "(?i)(Event Viewer|Computer Management|Task Scheduler|Просмотр событий|Управление компьютером|Планировщик задач|Планировщик заданий)"
action = "tile"
column_width = 0.8

[[window_rules]]
match_executable = "mmc.exe"
match_class = "^MMCMainFrame$"
action = "tile"
column_width = 0.618

# GearUP uses a generic launcher.exe: constrain it to its own window title.
[[window_rules]]
match_executable = "launcher.exe"
match_title = "(?i)GearUP"
action = "float"

# AIDA64 main window only; do not resize sensor panels.
[[window_rules]]
match_executable = "aida64.exe"
match_title = "(?i)^AIDA64 (Extreme|Engineer|Business|Network Audit)(\\s|$)"
action = "tile"
column_width = 0.5

# Classic console host only; not every child cmd/python process.
[[window_rules]]
match_class = "^ConsoleWindowClass$"
action = "tile"
column_width = 0.5

# IDLE Shell only: other pythonw/Tk tools retain their own policies.
[[window_rules]]
match_executable = "pythonw.exe"
match_class = "^TkTopLevel$"
match_title = "(?i)^(IDLE Shell|Python [0-9].*Shell)"
action = "tile"
column_width = 0.8

# Visual Studio Installer only; setup.exe is not globally assigned.
[[window_rules]]
match_executable = "setup.exe"
match_title = "(?i)^Visual Studio Installer"
action = "float"

