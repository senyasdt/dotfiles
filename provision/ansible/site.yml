---
- name: Provision local workstation
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - ../../.chezmoidata/packages.yaml

  vars:
    profile_string: "{{ lookup('env', 'CHEZMOI_PROFILES') | default('full', true) }}"
    active_profiles: "{{ profile_string.split(',') }}"
    is_desktop: "{{ 'desktop' in active_profiles }}"
    is_full: "{{ 'full' in active_profiles or is_desktop }}"
    is_lite: "{{ 'lite' in active_profiles }}"
    homebrew_prefix: >-
      {{ '/home/linuxbrew/.linuxbrew'
         if ansible_facts.system == 'Linux'
         else ('/opt/homebrew' if ansible_facts.architecture == 'arm64' else '/usr/local') }}
    brew_bin: "{{ homebrew_prefix }}/bin/brew"
    brew_formulae: >-
      {{ packages.brew.common
         + (packages.brew.full if is_full else [])
         + (packages.brew.linux if ansible_facts.system == 'Linux' else [])
         + (packages.brew.darwin if ansible_facts.system == 'Darwin' else [])
         + (packages.brew.desktop_darwin_formulae if ansible_facts.system == 'Darwin' and is_desktop else []) }}
    brew_casks: >-
      {{ (packages.brew.full_darwin_casks if ansible_facts.system == 'Darwin' and is_full else [])
         + (packages.brew.desktop_darwin_casks if ansible_facts.system == 'Darwin' and is_desktop else []) }}
    docker_apt_distribution: "{{ ansible_facts.distribution | lower }}"
    docker_apt_architecture: >-
      {{ 'amd64' if ansible_facts.architecture in ['x86_64', 'amd64']
         else ('arm64' if ansible_facts.architecture in ['aarch64', 'arm64']
         else ansible_facts.architecture) }}
    docker_provision_user: "{{ lookup('env', 'SUDO_USER') | default(ansible_user_id, true) }}"

  tasks:
    - name: Install Debian base packages
      become: true
      ansible.builtin.apt:
        name: "{{ packages.apt.linux + (packages.apt.full if is_full else []) }}"
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Install Docker repository prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
      when:
        - is_full
        - ansible_facts.distribution in ["Debian", "Ubuntu"]

    - name: Create Docker APT keyring directory
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when:
        - is_full
        - ansible_facts.distribution in ["Debian", "Ubuntu"]

    - name: Install Docker APT signing key
      become: true
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_apt_distribution }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when:
        - is_full
        - ansible_facts.distribution in ["Debian", "Ubuntu"]

    - name: Configure Docker APT repository
      become: true
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ docker_apt_distribution }}
          {{ ansible_facts.distribution_release }} stable
        filename: docker
        state: present
        update_cache: true
      when:
        - is_full
        - ansible_facts.distribution in ["Debian", "Ubuntu"]

    - name: Install Docker Engine
      become: true
      ansible.builtin.apt:
        name: "{{ packages.apt.docker }}"
        state: present
      when:
        - is_full
        - ansible_facts.distribution in ["Debian", "Ubuntu"]

    - name: Enable and start Docker Engine
      become: true
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
      when:
        - is_full
        - ansible_facts.distribution in ["Debian", "Ubuntu"]
        - ansible_facts.service_mgr == "systemd"

    - name: Allow the provisioned user to run Docker
      become: true
      ansible.builtin.user:
        name: "{{ docker_provision_user }}"
        groups:
          - docker
        append: true
      when:
        - is_full
        - ansible_facts.distribution in ["Debian", "Ubuntu"]
        - docker_provision_user != "root"

    - name: Check Homebrew
      ansible.builtin.stat:
        path: "{{ brew_bin }}"
      register: homebrew_bin
      when: ansible_facts.system in ["Darwin", "Linux"]

    - name: Install Homebrew
      ansible.builtin.shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        creates: "{{ brew_bin }}"
      when:
        - ansible_facts.system in ["Darwin", "Linux"]
        - not homebrew_bin.stat.exists

    - name: Install Homebrew formulae
      ansible.builtin.shell: |
        if "{{ brew_bin }}" list --formula "{{ item }}" >/dev/null 2>&1; then
          echo "already installed"
          exit 0
        fi
        "{{ brew_bin }}" install "{{ item }}"
      loop: "{{ brew_formulae }}"
      register: brew_formula_install
      changed_when: brew_formula_install.rc == 0 and 'already installed' not in (brew_formula_install.stdout + brew_formula_install.stderr)
      when: ansible_facts.system in ["Darwin", "Linux"]

    - name: Install macOS casks
      ansible.builtin.shell: |
        if "{{ brew_bin }}" list --cask "{{ item }}" >/dev/null 2>&1; then
          echo "already installed"
          exit 0
        fi
        set +e
        install_output="$("{{ brew_bin }}" install --cask "{{ item }}" 2>&1)"
        install_rc=$?
        printf '%s\n' "$install_output"
        if [ "$install_rc" -eq 0 ]; then
          exit 0
        fi
        if printf '%s\n' "$install_output" | grep -q "It seems there is already an App at"; then
          echo "app bundle already exists"
          exit 0
        fi
        if printf '%s\n' "$install_output" | grep -Eq "Download failed|requested URL returned error: 403"; then
          echo "cask download failed; skipping"
          exit 0
        fi
        if printf '%s\n' "$install_output" | grep -Eq "sudo: a terminal is required|sudo: a password is required"; then
          echo "cask requires interactive sudo; skipping"
          exit 0
        fi
        exit "$install_rc"
      loop: "{{ brew_casks }}"
      register: brew_cask_install
      changed_when: >-
        brew_cask_install.rc == 0
        and 'already installed' not in (brew_cask_install.stdout + brew_cask_install.stderr)
        and 'app bundle already exists' not in (brew_cask_install.stdout + brew_cask_install.stderr)
        and 'cask download failed; skipping' not in (brew_cask_install.stdout + brew_cask_install.stderr)
        and 'cask requires interactive sudo; skipping' not in (brew_cask_install.stdout + brew_cask_install.stderr)
      when:
        - ansible_facts.system == "Darwin"
        - brew_casks | length > 0

    - name: Check Cargo
      ansible.builtin.command:
        cmd: cargo --version
      register: cargo_check
      changed_when: false
      failed_when: false
      when: not is_lite

    - name: Install Rust toolchain
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        creates: "{{ ansible_env.HOME }}/.cargo/bin/cargo"
      when:
        - not is_lite
        - cargo_check.rc != 0

    - name: Install Cargo packages
      ansible.builtin.command:
        cmd: "{{ ansible_env.HOME }}/.cargo/bin/cargo install {{ item }}"
      loop: "{{ packages.cargo.desktop if is_desktop else [] }}"
      when:
        - not is_lite
        - is_desktop
